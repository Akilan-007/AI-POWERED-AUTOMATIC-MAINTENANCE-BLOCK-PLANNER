version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sih2026_postgres
    environment:
      POSTGRES_DB: railblock
      POSTGRES_USER: railblock_user
      POSTGRES_PASSWORD: railblock_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railblock_user -d railblock"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sih2026_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
